<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#0E1012;
  --surface:#171A1D;
  --surface-2:#1F2429;
  --line:#2C3237;
  --ink:#E9E5DD;
  --ink-dim:#8C9299;
  --brass:#C6A96B;
  --brass-soft:#8A7644;
  --alert:#B9524A;
  --r:10px;
  --fd:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --fb:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--fb);
  min-height:100svh;
  display:flex;
  justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.app{
  width:100%;
  max-width:440px;
  /* iOSのホーム画面起動時にノッチ／ホームバーへ潜り込まないようにする */
  padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(22px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  display:flex;
  flex-direction:column;
  gap:16px;
}

/* header */
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{
  margin:0;
  font-family:var(--fd);
  font-weight:600;
  font-size:21px;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.brand .right{display:flex;align-items:center;gap:10px}
.snd{
  display:flex;align-items:center;gap:6px;
  padding:6px 9px;
  background:transparent;
  border:1px solid var(--line);
  border-radius:99px;
  color:var(--ink-dim);
  font-family:var(--fb);
  font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  cursor:pointer;
}
.snd .dot{width:5px;height:5px;border-radius:50%;background:var(--line)}
.snd[aria-pressed="true"]{color:var(--ink);border-color:var(--brass-soft)}
.snd[aria-pressed="true"] .dot{background:var(--brass)}
.snd:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.help{
  width:26px;height:26px;
  display:grid;place-items:center;
  background:transparent;
  border:1px solid var(--line);
  border-radius:50%;
  color:var(--ink-dim);
  font-family:var(--fd);font-size:13px;
  cursor:pointer;
}
.help:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.modes{display:flex;gap:6px}
.mode{
  flex:1;
  padding:12px 4px;
  background:transparent;
  border:1px solid var(--line);
  border-radius:var(--r);
  color:var(--ink-dim);
  font-family:var(--fd);
  font-size:13px;
  font-weight:500;
  letter-spacing:.16em;
  text-transform:uppercase;
  cursor:pointer;
}
.mode[aria-selected="true"]{
  color:var(--ink);
  border-color:var(--brass-soft);
  background:linear-gradient(180deg,rgba(198,169,107,.10),rgba(198,169,107,.02));
}
.mode:disabled{opacity:.38;cursor:default}

/* status */
.status{
  display:grid;
  grid-template-columns:1fr auto auto;
  align-items:end;
  gap:14px;
  padding:12px 14px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r);
}
.stat .k{
  font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);
  display:block;margin-bottom:2px;
}
.stat .v{
  font-family:var(--fd);font-weight:500;line-height:1;
  font-variant-numeric:tabular-nums;
}
#st1v{font-size:34px;letter-spacing:-.02em}
#st2v{font-size:22px;color:var(--brass)}
#st3v{font-size:22px}
.status.warn #st3v{color:var(--alert)}

/* board */
.board-wrap{position:relative}
.board{
  display:grid;
  grid-template-columns:repeat(var(--n),1fr);
  gap:var(--gap);
  aspect-ratio:1;
}
.cell{
  display:grid;place-items:center;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--r);
  color:var(--ink);
  font-family:var(--fd);
  font-weight:500;
  font-variant-numeric:tabular-nums;
  font-size:var(--fs);
  padding:0;
  cursor:pointer;
  touch-action:manipulation;
  user-select:none;
  transition:background .12s ease,color .12s ease,border-color .12s ease,transform .08s ease;
}
.cell:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.cell.veiled{color:transparent}
.cell.idle{color:var(--ink-dim)}
.cell.done{
  background:#12161A;
  border-color:#232A2F;
  color:var(--brass-soft);
  transform:scale(.97);
}
.cell.hit{border-color:var(--brass);background:rgba(198,169,107,.14)}
.cell.miss{border-color:var(--alert);background:rgba(185,82,74,.16)}
/* 図形メモリー */
.cell.lit{background:var(--brass);border-color:var(--brass)}
.cell.found{background:rgba(198,169,107,.26);border-color:var(--brass-soft)}

/* overlay */
.overlay{
  position:absolute;inset:0;
  display:grid;place-items:center;
  background:rgba(14,16,18,.86);
  border-radius:var(--r);
  text-align:center;
  padding:20px;
}
.count{font-family:var(--fd);font-size:72px;font-weight:500;line-height:1;letter-spacing:-.03em;color:var(--brass)}
.count.txt{font-size:30px;letter-spacing:.14em}
.ov-inner{display:flex;flex-direction:column;align-items:center;gap:6px}
.ov-label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-dim)}
.ov-time{font-family:var(--fd);font-size:50px;font-weight:500;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ov-meta{font-size:12px;color:var(--ink-dim)}
.ov-best{font-size:12px;color:var(--brass);letter-spacing:.06em}

/* controls */
.controls{display:flex;flex-direction:column;gap:10px}
.sizes{display:flex;gap:6px}
.size{
  flex:1;padding:10px 0;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r);
  color:var(--ink-dim);
  font-family:var(--fb);font-size:13px;letter-spacing:.06em;
  cursor:pointer;
}
.size[aria-pressed="true"]{color:var(--ink);border-color:var(--brass-soft);background:rgba(198,169,107,.08)}
.size:disabled{opacity:.35;cursor:default}
.go{
  width:100%;padding:15px;
  background:var(--brass);
  border:none;border-radius:var(--r);
  color:#14161A;
  font-family:var(--fb);font-weight:700;font-size:15px;letter-spacing:.1em;
  cursor:pointer;
}
.go.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-dim);font-weight:500}
.records{
  display:flex;justify-content:space-between;
  font-size:11px;color:var(--ink-dim);letter-spacing:.04em;
  padding:0 2px;
}
.records b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
/* 遊び方ポップアップ */
.modal{
  position:fixed;inset:0;z-index:20;
  display:grid;place-items:center;
  padding:22px;
  background:rgba(8,9,10,.86);
}
.sheet{
  width:100%;max-width:380px;
  display:flex;flex-direction:column;gap:14px;
  padding:22px 20px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
}
.m-eyebrow{
  font-family:var(--fd);font-size:11px;font-weight:500;
  letter-spacing:.2em;text-transform:uppercase;color:var(--brass);
}
.m-title{
  margin:0;
  font-size:17px;font-weight:500;line-height:1.5;
  text-wrap:balance;
}
.m-list{
  list-style:none;margin:0;padding:0;
  display:flex;flex-direction:column;gap:9px;
  font-size:13px;line-height:1.6;color:var(--ink-dim);
}
.m-list li{display:flex;gap:10px}
.m-list li::before{content:"—";color:var(--brass-soft);flex:none}
.m-actions{display:flex;gap:8px;margin-top:2px}
.m-actions .go{flex:2}
.m-actions .go.ghost{flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app notranslate" translate="no">
  <header class="brand">
    <h1>Tap&nbsp;Order</h1>
    <div class="right">
      <button class="help" id="help" aria-label="遊び方を見る">?</button>
      <button class="snd" id="snd" aria-pressed="true" aria-label="効果音の切り替え"><span class="dot"></span>Sound</button>
    </div>
  </header>

  <div class="modes" role="tablist" aria-label="モード">
    <button class="mode" role="tab" data-mode="speed" aria-selected="true">Rush</button>
    <button class="mode" role="tab" data-mode="pattern" aria-selected="false">Flash</button>
    <button class="mode" role="tab" data-mode="sequence" aria-selected="false">Echo</button>
  </div>

  <div class="status" id="status">
    <div class="stat"><span class="k" id="st1k">Time</span><span class="v" id="st1v">0.000</span></div>
    <div class="stat"><span class="k" id="st2k">Next</span><span class="v" id="st2v">1</span></div>
    <div class="stat"><span class="k" id="st3k">Miss</span><span class="v" id="st3v">0</span></div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay">
      <div class="ov-inner" id="ovReady">
        <span class="ov-label" id="ovReadyLabel">Ready</span>
        <span class="ov-meta" id="ovHint">小さい数字から順にタップ</span>
      </div>
      <div class="count" id="ovCount" hidden>3</div>
      <div class="ov-inner" id="ovResult" hidden>
        <span class="ov-label" id="ovLabel">Clear</span>
        <span class="ov-time" id="ovTime">0.000</span>
        <span class="ov-meta" id="ovMeta">ミス 0 ／ 5×5</span>
        <span class="ov-best" id="ovBest"></span>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="sizes" id="sizes">
      <button class="size" data-n="3" aria-pressed="false">3 × 3</button>
      <button class="size" data-n="4" aria-pressed="false">4 × 4</button>
      <button class="size" data-n="5" aria-pressed="true">5 × 5</button>
    </div>
    <button class="go" id="go">スタート</button>
    <div class="records"><span id="bestLabel">ベスト（5×5）</span><b id="best">—</b></div>
  </div>
  <div class="modal" id="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <span class="m-eyebrow" id="mName">Rush</span>
      <h2 class="m-title" id="mTitle"></h2>
      <ul class="m-list" id="mList"></ul>
      <div class="m-actions">
        <button class="go" id="mStart">はじめる</button>
        <button class="go ghost" id="mClose">閉じる</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var board=$('board'), overlay=$('overlay'), ovReady=$('ovReady'), ovHint=$('ovHint'),
      ovReadyLabel=$('ovReadyLabel'), ovCount=$('ovCount'), ovResult=$('ovResult'), ovLabel=$('ovLabel'), ovTime=$('ovTime'),
      ovMeta=$('ovMeta'), ovBest=$('ovBest'), statusEl=$('status'),
      st1k=$('st1k'), st1v=$('st1v'), st2k=$('st2k'), st2v=$('st2v'), st3k=$('st3k'), st3v=$('st3v'),
      goBtn=$('go'), sizesEl=$('sizes'), modesEl=document.querySelector('.modes'),
      bestEl=$('best'), bestLabel=$('bestLabel');

  var MAX_MISS = 3;

  var MODE_INFO = {
    speed: {
      name:'Rush', jp:'ナンバーラッシュ',
      title:'散らばった数字を、小さい順にできるだけ速く',
      lines:[
        '1 から順に、数字のマスをタップしていきます',
        '最後の数字を押すまでのタイムがスコアです',
        '押し間違えても止まりません（ミス数だけ記録されます）',
        '盤面は 3×3 / 4×4 / 5×5 から選べます'
      ]
    },
    pattern: {
      name:'Flash', jp:'フラッシュ記憶',
      title:'一瞬だけ光ったマスを、全部おぼえて押し返す',
      lines:[
        '複数のマスが同時に光り、すぐ消えます',
        '光っていたマスを、順番は自由に全部タップします',
        '間違えるとそのステージは別の問題でやり直し',
        'ミス3回で終了。進んだステージ数がスコアです'
      ]
    },
    sequence: {
      name:'Echo', jp:'順番エコー',
      title:'光った順番を、そのままなぞり返す',
      lines:[
        'マスが1つずつ、順番に光ります',
        '同じ順番でタップして再現します',
        'ステージが進むと末尾に1つ増えます（前の順番はそのまま）',
        'ミス3回で終了。進んだステージ数がスコアです'
      ]
    }
  };

  var S = {
    mode:'speed', n:5, phase:'idle', timers:[],
    next:1, misses:0, t0:0, raf:0,          // 早押し
    stage:1, k:3, found:0, target:[],       // 図形メモリー
    seq:[], step:0                          // 順番メモリー
  };

  /* ---- 効果音（WebAudioで合成。音源ファイルなしでオフラインでも鳴る） ---- */
  var AC = null, muted = false;
  try { muted = localStorage.getItem('tapOrder.muted') === '1'; } catch(e){}

  function ctx(){
    if(!AC){
      var C = window.AudioContext || window.webkitAudioContext;
      if(!C) return null;
      try { AC = new C(); } catch(e){ return null; }
    }
    if(AC.state === 'suspended'){ try{ AC.resume(); }catch(e){} }
    return AC;
  }

  // プチッという破裂音：短いノイズの立ち上がり＋急降下するサイン波
  function pop(o){
    if(muted) return;
    var c = ctx(); if(!c) return;
    var t = c.currentTime + (o.at || 0);
    var dur = o.dur, osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f0, t);
    osc.frequency.exponentialRampToValueAtTime(o.f1, t + dur * 0.85);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.gain, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t); osc.stop(t + dur + 0.03);

    if(o.click){
      var len = Math.floor(c.sampleRate * 0.012);
      var buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for(var i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3);
      var n = c.createBufferSource(); n.buffer = buf;
      var bp = c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = o.clickHz || 2400; bp.Q.value = 0.9;
      var ng = c.createGain(); ng.gain.value = o.click;
      n.connect(bp); bp.connect(ng); ng.connect(c.destination);
      n.start(t);
    }
  }

  // マスごとの音程。ペンタトニックに乗せるので、どの順に鳴っても濁らない
  var PENTA = [0,2,4,7,9];
  function cellFreq(i){
    var total = S.n * S.n;
    var d = total > 1 ? Math.round(i * 10 / (total - 1)) : 0;   // 0〜10（約2オクターブ）
    var semi = PENTA[d % 5] + 12 * Math.floor(d / 5);
    return 220 * Math.pow(2, semi / 12);
  }

  // 同じ音の連打に聞こえないよう、押すたびに少しだけ音程を散らす
  var sfx = {
    tap:  function(){ pop({ f0: 680 + Math.random()*320, f1: 150, dur: 0.055, gain: 0.20, click: 0.09 }); },
    miss: function(){ pop({ type:'triangle', f0: 190, f1: 62, dur: 0.14, gain: 0.16, click: 0.03, clickHz: 700 }); },
    tick: function(){ pop({ f0: 440, f1: 410, dur: 0.05, gain: 0.08 }); },
    go:   function(){ pop({ f0: 760, f1: 700, dur: 0.13, gain: 0.13 }); },
    show: function(){ pop({ f0: 330, f1: 305, dur: 0.20, gain: 0.10 }); },
    clear:function(){
      pop({ f0: 700, f1: 200, dur: 0.06, gain: 0.18, click: 0.07, at: 0 });
      pop({ f0: 880, f1: 240, dur: 0.06, gain: 0.18, click: 0.07, at: 0.09 });
      pop({ f0:1150, f1: 300, dur: 0.10, gain: 0.20, click: 0.08, at: 0.18 });
    },
    note: function(i, o){
      o = o || {};
      var f = cellFreq(i);
      pop({ type:'triangle', f0: f, f1: f*0.995,
            dur: o.dur || 0.22, gain: o.gain || 0.16, click: o.click || 0, clickHz: 3000 });
    },
    over: function(){
      pop({ type:'triangle', f0: 520, f1: 300, dur: 0.14, gain: 0.15, at: 0 });
      pop({ type:'triangle', f0: 400, f1: 230, dur: 0.16, gain: 0.15, at: 0.13 });
      pop({ type:'triangle', f0: 290, f1: 140, dur: 0.30, gain: 0.16, at: 0.27 });
    }
  };

  var sndBtn = $('snd');
  function paintSnd(){ sndBtn.setAttribute('aria-pressed', String(!muted)); }
  sndBtn.addEventListener('click', function(){
    muted = !muted;
    try { localStorage.setItem('tapOrder.muted', muted ? '1' : '0'); } catch(e){}
    paintSnd();
    if(!muted) sfx.tap();
  });
  paintSnd();

  /* ---- 遊び方ポップアップ ---- */
  var modal=$('modal'), mName=$('mName'), mTitle=$('mTitle'), mList=$('mList');

  function openHelp(){
    var info = MODE_INFO[S.mode];
    mName.textContent = info.name + ' ／ ' + info.jp;
    mTitle.textContent = info.title;
    mList.textContent = '';
    info.lines.forEach(function(t){
      var li=document.createElement('li');
      li.appendChild(document.createTextNode(t));
      mList.appendChild(li);
    });
    modal.hidden = false;
  }
  function closeHelp(){ modal.hidden = true; }

  $('help').addEventListener('click', openHelp);
  $('mClose').addEventListener('click', closeHelp);
  $('mStart').addEventListener('click', function(){ closeHelp(); ctx(); start(); });
  modal.addEventListener('click', function(e){ if(e.target===modal) closeHelp(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && !modal.hidden) closeHelp(); });

  /* ---- 共通 ---- */
  function fmt(ms){ return (ms/1000).toFixed(3); }
  function key(){ return 'tapOrder.best.' + S.mode + '.' + S.n; }
  function readBest(){ try{ var v=localStorage.getItem(key()); return v ? +v : null; }catch(e){ return null; } }
  function writeBest(v){ try{ localStorage.setItem(key(), String(v)); }catch(e){} }
  function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
  function clearTimers(){ S.timers.forEach(clearTimeout); S.timers=[]; }
  function later(fn,ms){ S.timers.push(setTimeout(fn,ms)); }
  function cells(){ return board.querySelectorAll('.cell'); }
  function each(list, fn){ Array.prototype.forEach.call(list, fn); }

  function showBest(){
    var b = readBest();
    bestLabel.textContent = 'ベスト（' + S.n + '×' + S.n + '）';
    if(b === null) bestEl.textContent = '—';
    else bestEl.textContent = S.mode==='speed' ? (fmt(b) + ' s') : ('STAGE ' + b);
  }

  function geometry(){
    var n = S.n;
    board.style.setProperty('--n', n);
    board.style.setProperty('--gap', n===3 ? '10px' : n===4 ? '8px' : '6px');
    board.style.setProperty('--fs', n===3 ? '32px' : n===4 ? '25px' : '20px');
  }

  // 早押し用：1〜N²をシャッフルして並べる
  function buildNumbers(veiled){
    geometry();
    var total=S.n*S.n, nums=[], i, j, t;
    for(i=1;i<=total;i++) nums.push(i);
    for(i=nums.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=nums[i]; nums[i]=nums[j]; nums[j]=t; }
    board.textContent='';
    nums.forEach(function(v){
      var b=document.createElement('button');
      b.className='cell' + (veiled ? ' veiled' : ' idle');
      b.type='button'; b.dataset.v=v; b.textContent=v;
      board.appendChild(b);
    });
  }

  // 図形メモリー用：無地のマス
  function buildBlank(){
    geometry();
    board.textContent='';
    for(var i=0;i<S.n*S.n;i++){
      var b=document.createElement('button');
      b.className='cell'; b.type='button'; b.dataset.i=i;
      board.appendChild(b);
    }
  }

  function setPhase(p){
    S.phase=p;
    var running = (p!=='idle' && p!=='result');
    each(sizesEl.querySelectorAll('.size'), function(b){ b.disabled=running; });
    each(modesEl.querySelectorAll('.mode'), function(b){
      if(b.dataset.mode) b.disabled = running;
    });
    goBtn.textContent = running ? '中止' : (p==='result' ? 'もう一度' : 'スタート');
    goBtn.classList.toggle('ghost', running);
  }

  function setOverlay(which){
    overlay.hidden = (which === null);
    ovReady.hidden  = (which !== 'ready');
    ovCount.hidden  = (which !== 'count');
    ovResult.hidden = (which !== 'result');
  }

  function countdown(done){
    var c = 3;
    ovCount.classList.remove('txt');
    ovCount.textContent = c;
    setOverlay('count');
    var tick = function(){
      c--;
      if(c>0){ ovCount.textContent=c; buzz(10); sfx.tick(); later(tick,700); }
      else { ovCount.textContent='GO'; buzz(20); sfx.go(); later(done,450); }
    };
    later(tick,700);
  }

  /* ---- 早押しモード ---- */
  function speedReset(){
    S.next=1; S.misses=0;
    st1k.textContent='Time'; st1v.textContent='0.000';
    st2k.textContent='Next'; st2v.textContent='1';
    st3k.textContent='Miss'; st3v.textContent='0';
    statusEl.classList.remove('warn');
    ovHint.textContent=MODE_INFO.speed.title;
    buildNumbers(false);
  }

  function speedStart(){
    S.next=1; S.misses=0;
    st1v.textContent='0.000'; st2v.textContent='1'; st3v.textContent='0';
    statusEl.classList.remove('warn');
    buildNumbers(true);
    setPhase('count');
    countdown(function(){
      setOverlay(null);
      each(cells(), function(c){ c.classList.remove('veiled'); });
      setPhase('playing');
      S.t0=performance.now();
      var loop=function(){ st1v.textContent=fmt(performance.now()-S.t0); S.raf=requestAnimationFrame(loop); };
      S.raf=requestAnimationFrame(loop);
    });
  }

  function speedTap(cell){
    if(cell.classList.contains('done')) return;
    if(+cell.dataset.v === S.next){
      cell.classList.add('hit');
      (function(c){ later(function(){ c.classList.remove('hit'); c.classList.add('done'); }, 90); })(cell);
      S.next++;
      st2v.textContent = S.next > S.n*S.n ? '—' : S.next;
      buzz(8); sfx.tap();
      if(S.next > S.n*S.n) speedFinish();
    } else {
      S.misses++; st3v.textContent=S.misses;
      statusEl.classList.add('warn');
      cell.classList.add('miss');
      (function(c){ later(function(){ c.classList.remove('miss'); }, 180); })(cell);
      later(function(){ statusEl.classList.remove('warn'); }, 400);
      buzz(40); sfx.miss();
    }
  }

  function speedFinish(){
    var ms=performance.now()-S.t0;
    cancelAnimationFrame(S.raf);
    st1v.textContent=fmt(ms);
    var prev=readBest(), isBest = (prev===null || ms<prev);
    if(isBest) writeBest(ms);
    ovLabel.textContent='Clear';
    ovTime.textContent=fmt(ms);
    ovMeta.textContent='ミス ' + S.misses + ' ／ ' + S.n + '×' + S.n;
    ovBest.textContent = isBest ? '自己ベスト更新' : ('ベスト ' + fmt(prev) + ' s');
    setOverlay('result'); setPhase('result'); showBest();
    buzz([18,60,18]); sfx.clear();
  }

  /* ---- 図形メモリーモード ---- */
  // 点灯数の上限。盤面が広いほど多く出せる
  function kCap(){ return S.n===3 ? 6 : S.n===4 ? 9 : 12; }

  // 3→4→5 と増えたあとは、10ステージごとに1つ増える
  function kFor(stage){
    if(stage <= 3) return Math.min(kCap(), 2 + stage);
    return Math.min(kCap(), 5 + Math.floor((stage - 3) / 10));
  }
  // その点灯数になった最初のステージ
  function kFirstStage(k){ return k <= 5 ? k - 2 : 10 * (k - 5) + 3; }

  // 表示時間は1ステージごとに6%短縮。点灯数が増えるたびに少し戻る。
  // 下限100msは、フラッシュ暗算の世界記録（3桁15口を1.61秒＝1口あたり約0.107秒）に合わせたもの
  var FLASH_FLOOR = 100;
  function showMs(stage){
    var k = kFor(stage);
    var base = Math.min(3500, 900 + 220 * k);
    var since = Math.max(0, stage - kFirstStage(k));
    return Math.max(FLASH_FLOOR, Math.round(base * Math.pow(0.94, since)));
  }

  function patternReset(){
    S.stage=1; S.misses=0; S.found=0; S.target=[];
    st1k.textContent='Stage'; st1v.textContent='1';
    st2k.textContent='Found'; st2v.textContent='0 / ' + kFor(1);
    st3k.textContent='Miss';  st3v.textContent='0 / ' + MAX_MISS;
    statusEl.classList.remove('warn');
    ovHint.textContent=MODE_INFO.pattern.title;
    buildBlank();
  }

  function patternStatus(){
    st1v.textContent = S.stage;
    st2v.textContent = S.found + ' / ' + S.k;
    st3v.textContent = S.misses + ' / ' + MAX_MISS;
  }

  function patternStart(){
    S.stage=1; S.misses=0;
    buildBlank();
    S.k = kFor(1); S.found = 0; patternStatus();
    setPhase('count');
    countdown(function(){ patternShow(); });
  }

  // ステージ見出し（2ステージ目以降と、ミス後の再挑戦で使う）
  function patternBanner(text, then){
    ovCount.classList.add('txt');
    ovCount.textContent = text;
    setOverlay('count');
    later(then, 800);
  }

  function patternShow(){
    S.k = kFor(S.stage);
    S.found = 0;
    patternStatus();
    setOverlay(null);
    setPhase('show');

    var list = cells(), idx = [], i, j, t;
    for(i=0;i<list.length;i++) idx.push(i);
    for(i=idx.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
    S.target = idx.slice(0, S.k);

    each(list, function(c){ c.className='cell'; });
    S.target.forEach(function(i){ list[i].classList.add('lit'); });
    buzz(14); sfx.show();

    later(function(){
      each(cells(), function(c){ c.classList.remove('lit'); });
      setPhase('recall');
    }, showMs(S.stage));
  }

  function patternTap(cell){
    var i = +cell.dataset.i;
    if(cell.classList.contains('found')) return;      // 二度押しはノーカウント
    if(S.target.indexOf(i) >= 0){
      cell.classList.add('found');
      S.found++; patternStatus();
      buzz(8); sfx.tap();
      if(S.found === S.k) patternStageClear();
    } else {
      S.misses++; patternStatus();
      statusEl.classList.add('warn');
      cell.classList.add('miss');
      buzz(40); sfx.miss();
      setPhase('wait');
      later(function(){ statusEl.classList.remove('warn'); }, 400);
      if(S.misses >= MAX_MISS){
        later(patternOver, 700);
      } else {
        // 同じステージを、別の問題で出し直す
        later(function(){
          patternBanner('RETRY', function(){ patternShow(); });
        }, 700);
      }
    }
  }

  function patternStageClear(){
    setPhase('wait');
    buzz([18,60,18]); sfx.clear();
    S.stage++;
    later(function(){
      patternBanner('STAGE ' + S.stage, function(){ patternShow(); });
    }, 520);
  }

  function patternOver(){
    var cleared = S.stage - 1;
    var prev=readBest(), isBest = (cleared > 0 && (prev===null || cleared>prev));
    if(isBest) writeBest(cleared);
    ovLabel.textContent='Game Over';
    ovTime.textContent='STAGE ' + cleared;
    ovMeta.textContent='ミス ' + S.misses + ' ／ ' + S.n + '×' + S.n;
    ovBest.textContent = isBest ? '自己ベスト更新' : (prev===null ? '' : 'ベスト STAGE ' + prev);
    ovCount.classList.remove('txt');
    setOverlay('result'); setPhase('result'); showBest();
    sfx.over();
  }

  /* ---- 順番メモリーモード（Simon型：列は継ぎ足していく） ---- */
  // 1ステップの長さはステージごとに8%短縮（下限 点灯120ms／間隔60ms）。
  // それでも再生全体が5秒を超える場合は、列の長さに合わせてさらに詰める
  // （絶対下限 点灯90ms／間隔45ms）。列が伸びても再生が間延びしない。
  function seqTiming(stage, len){
    var f = stage > 5 ? Math.pow(0.92, stage - 5) : 1;
    var lit = Math.max(120, 500 * f);
    var gap = Math.max(60, 250 * f);
    var total = len * (lit + gap);
    if(total > 5000){
      var r = 5000 / total;
      lit = Math.max(90, lit * r);
      gap = Math.max(45, gap * r);
    }
    return { lit: Math.round(lit), gap: Math.round(gap) };
  }

  function seqStatus(){
    st1v.textContent = S.stage;
    st2v.textContent = S.step + ' / ' + S.seq.length;
    st3v.textContent = S.misses + ' / ' + MAX_MISS;
  }

  function seqReset(){
    S.stage=1; S.misses=0; S.seq=[]; S.step=0;
    st1k.textContent='Stage'; st1v.textContent='1';
    st2k.textContent='Step';  st2v.textContent='0 / 3';
    st3k.textContent='Miss';  st3v.textContent='0 / ' + MAX_MISS;
    statusEl.classList.remove('warn');
    ovHint.textContent=MODE_INFO.sequence.title;
    buildBlank();
  }

  // 直前と同じマスは続けない（点灯が繋がって1回に見えてしまうため）
  function seqAppend(count){
    var total = S.n * S.n;
    for(var c=0;c<count;c++){
      var last = S.seq.length ? S.seq[S.seq.length-1] : -1, i;
      do { i = Math.floor(Math.random()*total); } while(total > 1 && i === last);
      S.seq.push(i);
    }
  }

  function seqStart(){
    S.stage=1; S.misses=0; S.seq=[]; S.step=0;
    buildBlank(); seqStatus();
    setPhase('count');
    countdown(function(){ seqAppend(3); seqPlay(); });
  }

  function seqPlay(){
    setOverlay(null);
    setPhase('show');
    S.step=0; seqStatus();
    var list = cells();
    each(list, function(c){ c.className='cell'; });
    var t = seqTiming(S.stage, S.seq.length), L = t.lit, G = t.gap;
    S.seq.forEach(function(idx, n){
      later(function(){
        var c = cells()[idx];
        c.classList.add('lit');
        sfx.note(idx); buzz(10);
        later(function(){ c.classList.remove('lit'); }, L);
      }, n * (L + G));
    });
    later(function(){ setPhase('recall'); }, S.seq.length * (L + G) + 60);
  }

  function seqTap(cell){
    var i = +cell.dataset.i;
    if(i === S.seq[S.step]){
      cell.classList.add('lit');
      (function(c){ later(function(){ c.classList.remove('lit'); }, 140); })(cell);
      sfx.note(i, { dur:0.16, click:0.06 }); buzz(8);
      S.step++; seqStatus();
      if(S.step === S.seq.length) seqStageClear();
    } else {
      S.misses++; seqStatus();
      statusEl.classList.add('warn');
      cell.classList.add('miss');
      buzz(40); sfx.miss();
      setPhase('wait');
      later(function(){ statusEl.classList.remove('warn'); }, 400);
      if(S.misses >= MAX_MISS){
        later(seqOver, 700);
      } else {
        // 同じ列をもう一度再生して、同じステージをやり直す
        later(function(){ patternBanner('RETRY', function(){ seqPlay(); }); }, 700);
      }
    }
  }

  function seqStageClear(){
    setPhase('wait');
    buzz([18,60,18]); sfx.clear();
    S.stage++;
    later(function(){
      patternBanner('STAGE ' + S.stage, function(){ seqAppend(1); seqPlay(); });
    }, 520);
  }

  function seqOver(){
    var cleared = S.stage - 1;
    var prev=readBest(), isBest = (cleared > 0 && (prev===null || cleared>prev));
    if(isBest) writeBest(cleared);
    ovLabel.textContent='Game Over';
    ovTime.textContent='STAGE ' + cleared;
    ovMeta.textContent='ミス ' + S.misses + ' ／ ' + S.n + '×' + S.n;
    ovBest.textContent = isBest ? '自己ベスト更新' : (prev===null ? '' : 'ベスト STAGE ' + prev);
    ovCount.classList.remove('txt');
    setOverlay('result'); setPhase('result'); showBest();
    sfx.over();
  }

  /* ---- 入力とモード切替 ---- */
  board.addEventListener('pointerdown', function(e){
    var cell = e.target.closest('.cell');
    if(!cell) return;
    if(S.mode==='speed'){
      if(S.phase!=='playing') return;
      speedTap(cell);
    } else if(S.mode==='pattern'){
      if(S.phase!=='recall') return;
      patternTap(cell);
    } else {
      if(S.phase!=='recall') return;
      seqTap(cell);
    }
  });

  function reset(){
    clearTimers(); cancelAnimationFrame(S.raf);
    ovCount.classList.remove('txt');
    ovReadyLabel.textContent = MODE_INFO[S.mode].jp;
    if(S.mode==='speed') speedReset(); else if(S.mode==='pattern') patternReset(); else seqReset();
    setOverlay('ready');
    setPhase('idle');
    showBest();
  }

  function start(){
    clearTimers(); cancelAnimationFrame(S.raf);
    ovCount.classList.remove('txt');
    if(S.mode==='speed') speedStart(); else if(S.mode==='pattern') patternStart(); else seqStart();
  }

  modesEl.addEventListener('click', function(e){
    var b=e.target.closest('.mode');
    if(!b || b.disabled || !b.dataset.mode) return;
    S.mode=b.dataset.mode;
    each(modesEl.querySelectorAll('.mode'), function(x){ x.setAttribute('aria-selected', String(x===b)); });
    reset();
    openHelp();
  });

  sizesEl.addEventListener('click', function(e){
    var b=e.target.closest('.size');
    if(!b || b.disabled) return;
    S.n=+b.dataset.n;
    each(sizesEl.querySelectorAll('.size'), function(x){ x.setAttribute('aria-pressed', String(x===b)); });
    reset();
  });

  goBtn.addEventListener('click', function(){
    ctx(); // 最初のタップで音声を有効化（モバイルの制約）
    if(S.phase==='idle' || S.phase==='result') start();
    else reset();
  });

  reset();

  // はじめて開いたときだけ、遊び方を自動で出す
  try {
    if(localStorage.getItem('tapOrder.seenHelp') !== '1'){
      openHelp();
      localStorage.setItem('tapOrder.seenHelp','1');
    }
  } catch(e){}
})();

// オフライン起動用。https（またはlocalhost）配信のときだけ有効になる。
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
